DISCORD:
  # Option 1: Use a Discord Bot Token (from Discord Developer Portal)
  TOKEN: "Your discord bot token"
  GUILD_NAME: "Your guild name"
  # Option 2: Or simply use a Discord Webhook URL (no developer portal setup needed)
  WEBHOOK_URL: ""
  # Use the webhook's custom profile picture and name as configured in Discord (e.g. Tyrion Lannister)
  # When true (default): Keeps the webhook's own name and avatar as set in Discord settings.
  # When false: Overrides the sender name to the Instagram account name (e.g. Game of Thrones) while keeping the webhook's avatar.
  USE_WEBHOOK_PROFILE: true

INSTAGRAM:
  CHANNEL: "Your Discord Channel Name"
  # You can list one or multiple accounts here
  USERNAMES:
    - "gameofthrones"
    - "houseofthedragonhbo"
    - "aknightofthe7kingdomshbo"
    - "westerosies_"
  # How often the bot should check for new posts (in hours, e.g. 0.5 = 30 mins, 1 = 1 hour)
  HOURS: 1
  # (Optional) For high stability and zero rate-limiting, paste a sessionid cookie from a burner account
  SESSION_ID: ""
